ads:
  objective: ""             # sales / leads
  destination_url: ""
  currency: ""              # the ad account's currency code
  spend_cap_per_day: 0
  hard_stop_days: 0         # stop a test after this many days; 0 = no hard stop
  unit_economics:
    price: 0
    contribution_per_sale: 0
    break_even_cps: 0
  cps_ladder:               # cost per sale → action
    raise_below: 0
    hold_between: [0, 0]
    stop_counter_above: 0
  thresholds:               # the owner's numbers; no defaults. An empty key means ask before deciding on it
    min_impressions_per_cell:
    min_leader_link_clicks:
    decay_cpc_pct:
    decay_ctr_pct:
    max_frequency:
    overspend_pct:
    spend_share_band: []    # [low, high] share of spend per cell, in %
    cells_per_test:
    cull_cost_multiple:     # cull a creative past the impression gate at more than this × the leader's cost per LPV
    decision_metric_order: []   # e.g. [cost_per_link_click, cost_per_lpv, cost_per_atc, purchases]
    budget_step_pct:
    budget_step_min_days:
    data_window_days:       # the strategist's fresh-data window
    baseline_days:          # a live winner is compared with its own trailing baseline over this many days
    max_failed_refinements: # refinements of one angle in a row that failed before a new test
  attribution:
    shopify_utm_field: ""   # which visit's utm_content counts, e.g. lastVisit.utmParameters.content
  video:
    credits_per_clip: 0     # check the generator's current price
    min_credit_balance: 0   # never start a round below this balance
  authority:                # what Claude may do without asking; keep short and explicit
    act_then_report: []
    stop_and_ask: []
    approved_on: ""
angle_bank: []              # untested angles, one line each; if the live state keeps its own angle bank, that one wins
