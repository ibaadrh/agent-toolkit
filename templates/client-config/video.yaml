video:
  default_ratio: ""         # e.g. 9x16; ask when empty
  footage_dir: ""
  footage_map: {}           # clip name → what it shows
  renders: []
  presenter:
    first_frame_asset: ""
    notes: ""               # e.g. pixel patches applied to the first frame
  tts:
    voice: ""
    languages: []           # language codes, e.g. [en-US]
  end_card:
    cta: {}                 # language → call to action
    footer_line: ""
    duration_s: ""          # how long the end card holds
    zoom_per_frame: ""      # slow-zoom step per frame; 0 = no zoom
  captions:                 # the client's caption look; every key empty = ask
    font: ""
    size: ""
    colour_ass: ""          # ASS colour, blue-green-red: &H<BB><GG><RR>&
    outline: ""
    position: {}            # where captions sit per shot type, e.g. { default: [x, y], product: [x, y] }
    highlight_color_ass: ""
  framing:
    wide_zoom: ""           # how much a wide shot is scaled over its blurred copy; 1 = fit the width
    background_blur: ""     # ffmpeg boxblur value for the blurred copy
    background_darken: ""   # ffmpeg eq brightness for the blurred copy; 0 = none
  audio:
    voiceover_gap_s: ""     # pause between the presenter's section and the voice-over
  music:
    fade_in_s: ""
    fade_out_s: ""
    lead_in_s: ""           # how long before its drop a song starts, if music is timed to a drop
  loudnorm: ""              # ffmpeg loudnorm target, I=<LUFS>:TP=<dBTP>:LRA=<LU>
  naming: ""                # file naming pattern for finished videos
