voice:
  tone: ""                  # one line: how it sounds and what it never does
  person: ""                # we / I / brand name
  banned_words: []
  banned_phrases: []
  rules: []                # the client's house rules, one line each (punctuation, how numbers are written, emoji)
  approved_claims: []       # the only claims allowed in copy, verbatim
  claim_rules: []           # how claims may be phrased, per language
  spoken_variants: []       # claims said differently than written
  do_not: []                # habits that break the voice, one line each
  examples: []              # verbatim pieces the owner approved, with where each was used
  # Only for a voice file written as one person (emails sent as them). Keep it in the private config repo.
  person_voice:
    greetings: {}           # situation → greeting
    signoffs: {}            # situation → sign-off
    signposts: []           # short standalone lines used to break up longer messages
    register: {}            # internal / external → how the tone shifts
contact_line: ""            # appended to social posts or emails if used
hashtags:
  branded: []
  core: []
  industry: []
  niche: []
